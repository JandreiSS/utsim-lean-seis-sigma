[package]
name = "utsim-lss-app"
description = "UTSim LSS: Lean Six Sigma project manager of the UTSim family (native window)"
version = "0.1.0"
edition.workspace = true
# eframe 0.36 needs Rust 1.95.
rust-version = "1.95"

[[bin]]
name = "utsim-seis-sigma"
path = "src/main.rs"

[lib]
name = "utsim_lss_app"
path = "src/lib.rs"

[dependencies]
utsim-lss-core = { path = "../utsim-lss-core" }
utsim-lss-store = { path = "../utsim-lss-store" }
# The texts of the screens in the five languages (`idiomas/<código>/seis-sigma.ftl`).
utsim-idiomas.workspace = true
# The UTSim model of a project (stage L4): read, run and draw it; open it in UTSim through
# the launcher.
utsim-model.workspace = true
utsim-stats.workspace = true
utsim-core.workspace = true
# The data and analyses screen reads CSV and draws the charts (stage L3).
utsim-quality.workspace = true
utsim-diagram.workspace = true
# The drawn tools (fishbone, whys tree, live Pareto, S × O matrix), the same as in UTSim
# Qualidade and Segurança.
utsim-visual = { path = "../utsim-visual" }
utsim-launcher-core = { path = "../utsim-launcher-core" }
serde_json.workspace = true
serde.workspace = true
# The access token of the gemba page (the same version as the signatures').
getrandom = { version = "=0.2.17", features = ["std"] }
# The family's opening screen and the native file picker ("Procurar…").
utsim-ui-tema = { workspace = true, features = ["abertura", "arquivos"] }
# Same egui as the launcher and the 3D viewer, so Cargo.lock keeps one egui. Light: glow
# renderer only, no wgpu.
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
# Charts (Pareto); the same version as the 3D viewer, built on the same egui.
egui_plot = { version = "=0.37.0", default-features = false }

[dev-dependencies]
tempfile = "=3.27.0"
utsim-ui-tema = { workspace = true, features = ["captura"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
